<title>Castle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Marcellus&display=swap">
<style>
/* Yerleşim: solda tam boy harita sahnesi, sağda defter gibi okunan panel; haritanın altında sur şeridi. Metin sola hizalı.
   Renk: taş ve deniz yeşili zemin, tek vurgu pirinç sarısı (kaleler). Yazı: Marcellus (başlık), IBM Plex Sans (metin ve rakam). */
:root{
  --bg:#EDF1EE; --sea:#D2DEDB; --land:#E6EAE3; --land-tr:#F9FBF7;
  --paper:#F7F9F6; --paper-2:#FFFFFF; --line:#C6D1CC;
  --ink:#14292A; --ink-2:#4C6463; --ink-3:#7C908E;
  --brass:#946410; --brass-soft:#F0E2BF; --steel:#3F6686; --stone:#5B7270;
  --d1:#A9B6B2; --bad:#A4432F; --good:#2B7A57;
  --f-display:"Marcellus","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1D1E; --sea:#102527; --land:#172D2F; --land-tr:#223F41;
  --paper:#122527; --paper-2:#193234; --line:#2D4749;
  --ink:#E5EDE9; --ink-2:#A6BAB6; --ink-3:#78938F;
  --brass:#E3B24D; --brass-soft:#3B3015; --steel:#93B8DA; --stone:#93ACA9;
  --d1:#3F595B; --bad:#E38F7D; --good:#72D0A5; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0D1D1E; --sea:#102527; --land:#172D2F; --land-tr:#223F41;
  --paper:#122527; --paper-2:#193234; --line:#2D4749;
  --ink:#E5EDE9; --ink-2:#A6BAB6; --ink-3:#78938F;
  --brass:#E3B24D; --brass-soft:#3B3015; --steel:#93B8DA; --stone:#93ACA9;
  --d1:#3F595B; --bad:#E38F7D; --good:#72D0A5; color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
*,*::before,*::after{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button[disabled]{cursor:default}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}

/* üst şerit */
.bar{display:flex;align-items:center;gap:14px;padding-block:9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--paper);border-bottom:1px solid var(--line);position:relative;z-index:5}
.mark{font-family:var(--f-display);font-size:25px;line-height:1;letter-spacing:.02em;display:flex;align-items:center;gap:9px;background:none;border:0;padding:2px 0}
.mark svg{width:22px;height:24px;flex:none;color:var(--brass)}
.mark-sub{color:var(--ink-2);font-size:13.5px;white-space:nowrap}
.find{position:relative;margin-left:auto;flex:0 1 250px;min-width:0}
.find input{width:100%;height:36px;border:1px solid var(--line);border-radius:18px;background:var(--paper-2);padding:0 14px;font-size:14px}
.find input::placeholder{color:var(--ink-3)}
.find-list{position:absolute;right:0;top:42px;width:max(100%,280px);max-width:calc(100vw - 32px);background:var(--paper-2);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 12px 30px -18px var(--ink)}
.find-list button{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:8px 12px;font-size:14px}
.find-list button:first-child{border-top:0}
.find-list button:hover,.find-list button:focus-visible{background:var(--brass-soft)}
.find-list span.nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.find-list small{color:var(--ink-2);margin-left:auto;white-space:nowrap}
.ghost{height:36px;border:1px solid var(--line);border-radius:18px;background:none;padding:0 14px;font-size:14px;white-space:nowrap}
.ghost:hover{border-color:var(--ink-2)}
.tk{font-weight:600;letter-spacing:.03em;font-variant-numeric:tabular-nums}

/* sahne */
.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,440px);min-height:0}
.map{position:relative;min-height:0;overflow:hidden;background:var(--bg);touch-action:none}
#cv{display:block;position:absolute;inset:0}
.pin{position:absolute;transform:translate(-50%,-22px);pointer-events:none;display:flex;flex-direction:column;align-items:center}
.pin i{display:block;width:44px;height:44px;border-radius:50%;border:2px solid var(--brass);animation:pulse 2.4s ease-out infinite}
.pin span{margin-top:6px;background:var(--paper-2);border:1px solid var(--line);border-radius:14px;padding:3px 11px;font-size:13px;white-space:nowrap}
@keyframes pulse{0%{transform:scale(.55);opacity:1}100%{transform:scale(1.5);opacity:0}}
.tip{position:absolute;max-width:270px;background:var(--paper-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.4;pointer-events:none;box-shadow:0 10px 24px -16px var(--ink)}
.tip em{display:block;font-style:normal;color:var(--ink-2);margin-top:2px}
.toast{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);background:var(--ink);color:var(--paper);border-radius:18px;padding:8px 16px;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.legend{position:absolute;top:12px;left:max(14px,env(safe-area-inset-left,0px));font-size:13px;color:var(--ink-2);pointer-events:none;max-width:min(380px,60%)}
.legend b{font-family:var(--f-display);font-weight:400;font-size:19px;color:var(--ink);display:block;line-height:1.25}

/* sur şeridi */
.rail{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:8px;padding-block:9px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:12px;background:linear-gradient(to top,var(--bg) 62%,transparent)}
.steps{display:flex;gap:6px;list-style:none;margin:0;padding:0;overflow-x:auto;min-width:0;flex:1;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.steps button{display:flex;align-items:center;gap:6px;height:34px;border:1px solid var(--line);background:var(--paper);border-radius:17px;padding:0 12px;font-size:13.5px;white-space:nowrap}
.steps button b{font-weight:500}
.steps button i{font-style:normal;color:var(--ink-2);font-variant-numeric:tabular-nums}
.steps button i:empty{display:none}
.steps button[aria-current="step"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.steps button[aria-current="step"] i{color:var(--paper);opacity:.75}
.nav{height:34px;min-width:34px;border-radius:17px;border:1px solid var(--line);background:var(--paper);padding:0 12px;font-size:14px;white-space:nowrap;max-width:46%;overflow:hidden;text-overflow:ellipsis}
.nav.go{background:var(--brass);border-color:var(--brass);color:var(--paper-2);font-weight:500}
.nav[disabled]{opacity:.4}

/* panel */
.side{min-height:0;overflow:auto;background:var(--paper);border-left:1px solid var(--line)}
.side-in{padding-block:20px 28px;padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;max-width:560px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:29px;line-height:1.16}
h2{font-size:24px;line-height:1.2}
h3{font-size:17px;line-height:1.3;margin-top:6px}
p{margin:0}
.lead{font-size:16px;color:var(--ink-2)}
.note{font-size:13px;color:var(--ink-2)}
.cta{align-self:flex-start;height:42px;border-radius:21px;border:0;background:var(--brass);color:var(--paper-2);padding:0 22px;font-size:15px;font-weight:500}
.cta[disabled]{opacity:.5}
.link{background:none;border:0;padding:0;color:var(--steel);text-decoration:underline;text-underline-offset:3px;font-size:inherit;text-align:left}
a{color:var(--steel);text-underline-offset:3px}

.ladder{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.ladder li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline;font-size:14px}
.ladder .n{font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.ladder .b{grid-column:1/-1;height:5px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.ladder .b::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--w);min-width:3px;background:var(--stone);border-radius:3px}
.ladder li.last .b::after{background:var(--brass)}

.bars{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.bars button{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;text-align:left;background:none;border:0;padding:3px 0;font-size:14px}
.bars button i{font-style:normal;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.bars button span.b{grid-column:1/-1;height:5px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.bars button span.b::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--w);min-width:3px;background:var(--bad);opacity:.7;border-radius:3px}
.bars button[aria-pressed="true"]{font-weight:600}
.bars button[aria-pressed="true"] span.b::after{opacity:1}

.rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.rows button{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:0 10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 2px;font-size:14px;align-items:baseline}
.rows button:hover{background:var(--paper-2)}
.rows .tk{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rows .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rows .mc{color:var(--ink-2);font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.rows .wy{grid-column:2/-1;color:var(--ink-2);font-size:13px}
.more{font-size:13px;color:var(--ink-2)}

.cards{display:flex;flex-direction:column;gap:10px}
.card{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;align-items:center;width:100%;text-align:left;background:var(--paper-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card:hover{border-color:var(--ink-2)}
.card.kale{border-color:var(--brass);box-shadow:inset 3px 0 0 var(--brass)}
.card svg{width:26px;height:30px;grid-row:1/3}
.card .t{font-size:15px}
.card .o{grid-column:2/3;font-size:13px;color:var(--ink-2)}
.card .m{grid-row:1/3;grid-column:3;text-align:right;font-family:var(--f-display);font-size:21px;font-variant-numeric:tabular-nums;white-space:nowrap}
.card .m small{display:block;font-family:var(--f-body);font-size:12px;color:var(--ink-2)}

/* şirket sayfası */
.back{align-self:flex-start;background:none;border:0;padding:0;color:var(--ink-2);font-size:14px;text-decoration:underline;text-underline-offset:3px;text-align:left}
.back:hover{color:var(--ink)}
.head{display:flex;flex-direction:column;gap:4px}
.head .sec{color:var(--ink-2);font-size:14px}
.pill{align-self:flex-start;display:inline-flex;align-items:center;gap:7px;border-radius:14px;padding:3px 12px;font-size:13.5px;font-weight:500;border:1px solid var(--line);background:var(--paper-2)}
.pill.kale{background:var(--brass);border-color:var(--brass);color:var(--paper-2)}
.pill.bekle,.pill.sirada{border-color:var(--steel);color:var(--steel)}
.pill.out{border-color:var(--bad);color:var(--bad)}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px 16px;margin:0}
.facts div{min-width:0}
.facts dt{font-size:12.5px;color:var(--ink-2)}
.facts dd{margin:0;font-size:16px;font-variant-numeric:tabular-nums}
.facts dd small{font-size:12.5px;color:var(--ink-2);display:block}
.path{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:14px}
.path li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px}
.path .ok{color:var(--good)} .path .no{color:var(--bad)} .path .na{color:var(--ink-3)} .path .wt{color:var(--steel)}
.path small{display:block;color:var(--ink-2);font-size:13px}
.txt{max-width:62ch}
.ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;max-width:62ch}
.fig{background:var(--paper-2);border:1px solid var(--line);border-radius:10px;padding:12px 12px 8px}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:12.5px;color:var(--ink-2);margin-top:6px}
figure{margin:0}
.kv{margin:0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 14px;font-size:14px}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.kv dt small{display:block;font-size:12.5px}
.kv dd b{font-weight:600}
.src{list-style:none;margin:0;padding:0;font-size:13px;display:flex;flex-direction:column;gap:4px}
.scores{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-size:14px;margin:0}
.scores dt{color:var(--ink-2)}
.scores dd{margin:0;letter-spacing:2px;color:var(--stone)}
.ask{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.ask textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:10px;background:var(--paper-2);padding:10px 12px;font-size:14px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--paper-2);border-radius:14px;padding:4px 11px;font-size:13px}
.chips button:hover{border-color:var(--ink-2)}
.ask-row{display:flex;gap:8px;align-items:center}
.conv{display:flex;flex-direction:column;gap:8px}
.conv:empty{display:none}
.ans{white-space:pre-wrap;font-size:14.5px;background:var(--paper-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;max-width:62ch}
.qq{font-size:13.5px;font-weight:500}
.er{font-size:13px;color:var(--bad)}

/* yöntem */
.sheet{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--ink) 45%,transparent);display:flex;justify-content:flex-end;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-in{width:min(640px,100%);height:100%;overflow:auto;background:var(--paper);padding-block:22px 40px;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.sheet-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.walls{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.walls>li{border-left:3px solid var(--stone);padding-left:14px}
.walls b{font-family:var(--f-display);font-weight:400;font-size:18px;display:block}
.walls ul{margin:4px 0 0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:3px}
.sl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;font-size:14px}
.sl input{grid-column:1/-1;width:100%;accent-color:var(--brass)}
.sl output{font-variant-numeric:tabular-nums;font-weight:600}
.pr{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;font-size:14px}
.pr li{display:flex;flex-direction:column;gap:3px;max-width:62ch}
.pr b{font-weight:600}
.pr small{color:var(--ink-2);font-size:13px}
.pr .ap{color:var(--ink-2)}
.pr .sr{font-size:13px;color:var(--ink-2)}

.lang{display:flex;flex:none;height:36px;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.lang button{border:0;background:none;padding:0 9px;font-size:13px;font-weight:500;letter-spacing:.04em;color:var(--ink-2)}
.lang button:first-child{padding-left:12px}
.lang button:last-child{padding-right:12px}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.lang button:focus-visible{outline-offset:-3px}

@media (max-width:980px){ .mark-sub{display:none} }
@media (max-width:480px){ .ghost{padding:0 10px} .lang button{padding:0 7px} .lang button:first-child{padding-left:10px} .lang button:last-child{padding-right:10px} }
@media (max-width:860px){
  .stage{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(250px,43%) minmax(0,1fr)}
  .side{border-left:0;border-top:1px solid var(--line)}
  .side-in{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:none}
  h1{font-size:25px} h2{font-size:22px}
  .steps button:not([aria-current="step"]) b.hasn{display:none}
  .legend{top:6px;left:max(8px,env(safe-area-inset-left,0px));max-width:calc(100% - 16px);font-size:12px;line-height:1.3;background:color-mix(in srgb,var(--paper) 82%,transparent);border-radius:8px;padding:2px 8px}
  .legend b{display:none}
  .mark{font-size:22px}
  .bar{gap:9px}
}
@media (max-width:860px) and (max-height:520px){ .stage{grid-template-rows:minmax(150px,40%) minmax(0,1fr)} }
@media (prefers-reduced-motion:reduce){ .pin i{animation:none} }

/* başka bir sitenin içinde (çerçevede) açıldığında: o sayfanın kaydırmasına karışma, tam ekran bağlantısı göster */
.full{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:inherit}
.full svg{width:14px;height:14px;flex:none}
html.embed .map{touch-action:pan-y}
.tiny{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px 16px;text-align:center;min-height:0;overflow:auto;background:var(--paper)}
.tiny p{margin:0;font-size:14px;line-height:1.4;color:var(--ink-2);max-width:44ch}
.tiny .cta{display:inline-flex;align-items:center;text-decoration:none;align-self:center;flex:none}
#app.is-tiny .stage{display:none}
@media (max-width:560px){ .full span{display:none} .full{padding:0 10px} }
@media (max-width:480px){ html.embed .mark{font-size:0;gap:0} }  /* dar çerçevede arama kutusuna yer açmak için yazı gizlenir, simge kalır */
</style>

<div id="app" lang="tr">
  <header class="bar">
    <button class="mark" id="home" aria-label="Castle, dünya haritasına dön">
      <svg viewBox="0 0 22 24" aria-hidden="true"><path d="M2 23V5h3.6v3h3.6V5h3.6v3h3.6V5H20v18h-6.2v-5.2a2.8 2.8 0 0 0-5.6 0V23z" fill="currentColor"/></svg>
      Castle
    </button>
    <span class="mark-sub" id="sub">değer yatırımı atlası</span>
    <div class="find">
      <input id="q" type="search" placeholder="Hisse, ülke ara" autocomplete="off" aria-label="Ara: hisse kodu, şirket adı ya da ülke">
      <div class="find-list" id="ql" hidden></div>
    </div>
    <div class="lang" id="lang" role="group" aria-label="Dil"><button data-lang="tr" aria-pressed="true" title="Türkçe">TR</button><button data-lang="en" aria-pressed="false" title="English">EN</button></div>
    <button class="ghost" id="method">Yöntem</button>
    <a class="ghost full" id="full" href="./" target="_blank" rel="noopener" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9.5 2H14v4.5M14 2 8.8 7.2M6.5 14H2V9.5M2 14l5.2-5.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="fullt">Tam ekran</span></a>
  </header>
  <main class="stage">
    <section class="map" id="map" aria-label="Harita">
      <canvas id="cv" role="img" aria-label="Dünya haritası. Bir ülke seçilince şirketleri görünür; süzgeçte ilerleyen şirket merkeze yaklaşır. Aynı bilgi yandaki listelerde de var."></canvas>
      <div class="legend" id="legend" hidden></div>
      <div class="pin" id="pin" hidden><i></i><span id="pinl"></span></div>
      <div class="tip" id="tip" hidden></div>
      <div class="toast" id="toast" role="status" hidden></div>
      <nav class="rail" id="rail" aria-label="Surlar">
        <button class="nav" id="prev">Uzaklaş</button>
        <ol class="steps" id="steps"></ol>
        <button class="nav go" id="next">Yaklaş</button>
      </nav>
    </section>
    <aside class="side" id="side"><div class="side-in" id="panel"></div></aside>
  </main>
  <div class="tiny" id="tiny" hidden><p id="tinyt"></p><a class="cta" id="tinyb" href="./" target="_blank" rel="noopener"></a></div>
