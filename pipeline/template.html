<title>Castle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Marcellus&display=swap">
<style>
/* Castle, genç Buffett yöntemi (24 Kasım 2026): Borsa İstanbul'un bütün şirketleri dört mercekle taranır.
   Yerleşim: solda liste (özet, mercek sekmeleri, tablo), sağda şirket defteri. Telefonda defter listenin üstüne açılır.
   Renk: taş ve deniz yeşili zemin, tek vurgu pirinç sarısı. Yazı: Marcellus (başlık), IBM Plex Sans (metin ve rakam). */
:root{
  --bg:#EDF1EE; --paper:#F7F9F6; --paper-2:#FFFFFF; --line:#C6D1CC;
  --ink:#14292A; --ink-2:#4C6463; --ink-3:#7C908E;
  --brass:#946410; --brass-soft:#F0E2BF; --steel:#3F6686; --stone:#5B7270;
  --bad:#A4432F; --good:#2B7A57;
  --f-display:"Marcellus","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1D1E; --paper:#122527; --paper-2:#193234; --line:#2D4749;
  --ink:#E5EDE9; --ink-2:#A6BAB6; --ink-3:#78938F;
  --brass:#E3B24D; --brass-soft:#3B3015; --steel:#93B8DA; --stone:#93ACA9;
  --bad:#E38F7D; --good:#72D0A5; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0D1D1E; --paper:#122527; --paper-2:#193234; --line:#2D4749;
  --ink:#E5EDE9; --ink-2:#A6BAB6; --ink-3:#78938F;
  --brass:#E3B24D; --brass-soft:#3B3015; --steel:#93B8DA; --stone:#93ACA9;
  --bad:#E38F7D; --good:#72D0A5; color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
*,*::before,*::after{box-sizing:border-box}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:28px;line-height:1.16} h2{font-size:23px;line-height:1.2} h3{font-size:17px;line-height:1.3;margin-top:4px}
p{margin:0}
a{color:var(--steel);text-underline-offset:3px}
.tk{font-weight:600;letter-spacing:.03em;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--ink-2)}
.lead{font-size:15.5px;color:var(--ink-2);max-width:70ch}

/* üst şerit */
.bar{display:flex;align-items:center;gap:12px;padding-block:9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--paper);border-bottom:1px solid var(--line)}
.mark{font-family:var(--f-display);font-size:25px;line-height:1;letter-spacing:.02em;display:flex;align-items:center;gap:9px;background:none;border:0;padding:2px 0}
.mark svg{width:22px;height:24px;flex:none;color:var(--brass)}
.mark-sub{color:var(--ink-2);font-size:13.5px;white-space:nowrap}
.find{margin-left:auto;flex:0 1 240px;min-width:0}
.find input{width:100%;height:36px;border:1px solid var(--line);border-radius:18px;background:var(--paper-2);padding:0 14px;font-size:14px}
.ghost{height:36px;border:1px solid var(--line);border-radius:18px;background:none;padding:0 14px;font-size:14px;white-space:nowrap}
.ghost:hover{border-color:var(--ink-2)}
.lang{display:flex;flex:none;height:36px;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.lang button{border:0;background:none;padding:0 9px;font-size:13px;font-weight:500;letter-spacing:.04em;color:var(--ink-2)}
.lang button:first-child{padding-left:12px} .lang button:last-child{padding-right:12px}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* sahne */
.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,460px);min-height:0}
.list{min-height:0;overflow:auto}
.list-in{padding:20px max(16px,env(safe-area-inset-left,0px)) 40px;display:flex;flex-direction:column;gap:16px;max-width:1100px}
.side{min-height:0;overflow:auto;background:var(--paper);border-left:1px solid var(--line)}
.side-in{padding:20px max(20px,env(safe-area-inset-right,0px)) 32px 20px;display:flex;flex-direction:column;gap:14px}

.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kpi{background:var(--paper-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left}
button.kpi:hover{border-color:var(--ink-2)}
.kpi b{display:block;font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--ink-2)}
.kpi.hot b{color:var(--brass)}
.warn{background:var(--brass-soft);border-radius:10px;padding:10px 12px;font-size:14px;max-width:80ch}

.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{display:flex;align-items:center;gap:6px;height:34px;border:1px solid var(--line);background:var(--paper);border-radius:17px;padding:0 12px;font-size:13.5px;white-space:nowrap}
.tabs button i{font-style:normal;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tabs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.tabs button[aria-pressed="true"] i{color:var(--paper);opacity:.75}
.tools{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:13.5px;color:var(--ink-2)}
.tools label{display:flex;gap:6px;align-items:center}

.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-weight:500;font-size:12.5px;color:var(--ink-2);text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--bg)}
.tbl th:nth-child(-n+2),.tbl td:nth-child(-n+2){text-align:left}
.tbl th button{background:none;border:0;padding:0;color:inherit;font:inherit}
.tbl th[aria-sort] button::after{content:" ▾"} .tbl th[aria-sort="ascending"] button::after{content:" ▴"}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td.nm{max-width:260px;overflow:hidden;text-overflow:ellipsis}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--paper-2)}
.tbl tbody tr[aria-selected="true"] td{background:var(--brass-soft)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:10px;padding:0 7px;font-size:12px;margin-left:3px;color:var(--ink-2);background:var(--paper-2)}
.chip.on{border-color:var(--brass);color:var(--paper-2);background:var(--brass)}
.chip.nr{border-color:var(--steel);color:var(--steel)}
.chip.bad{border-color:var(--bad);color:var(--bad)}
.more{background:none;border:0;color:var(--steel);text-decoration:underline;text-underline-offset:3px;padding:6px 0;font-size:14px}
.ok{color:var(--good)} .no{color:var(--bad)} .na{color:var(--ink-3)}

/* şirket defteri */
.back{align-self:flex-start;background:none;border:0;padding:0;color:var(--ink-2);font-size:14px;text-decoration:underline;text-underline-offset:3px}
.head .sec{color:var(--ink-2);font-size:14px}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:10px 16px;margin:0}
.facts dt{font-size:12.5px;color:var(--ink-2)} .facts dd{margin:0;font-size:16px;font-variant-numeric:tabular-nums}
.facts dd small{display:block;font-size:12px;color:var(--ink-2)}
.lens{border:1px solid var(--line);border-radius:10px;background:var(--paper-2);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.lens.on{border-color:var(--brass);box-shadow:inset 3px 0 0 var(--brass)}
.lens h3{margin:0;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.lens h3 small{font-family:var(--f-body);font-size:13px;color:var(--ink-2)}
.kv{margin:0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;font-size:14px}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.kv .sum{border-top:1px solid var(--line);padding-top:4px;font-weight:600;color:var(--ink)}
.chk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:14px}
.chk li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:6px}
.chk small{display:block;color:var(--ink-2);font-size:12.5px}
.txt{max-width:66ch;font-size:14.5px}
.ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:14px}
.src{list-style:none;margin:0;padding:0;font-size:13px;display:flex;flex-direction:column;gap:3px}
.flag{border:1px solid var(--bad);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--bad)}
.empty{color:var(--ink-2);font-size:14.5px;display:flex;flex-direction:column;gap:10px}

/* yöntem */
.sheet{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--ink) 45%,transparent);display:flex;justify-content:flex-end}
.sheet-in{width:min(680px,100%);height:100%;overflow:auto;background:var(--paper);padding:22px max(22px,env(safe-area-inset-right,0px)) 40px max(22px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.mlist>li{border-left:3px solid var(--stone);padding-left:14px;font-size:14.5px}
.mlist b{font-family:var(--f-display);font-weight:400;font-size:18px;display:block}
.mlist ul{margin:4px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.mlist small{color:var(--ink-2);font-size:13px;display:block;margin-top:3px}

@media (max-width:980px){ .mark-sub{display:none} }
@media (max-width:860px){
  .stage{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0;top:55px;z-index:10;border-left:0;border-top:1px solid var(--line)}
  .side[hidden]{display:none}
  .side-in{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .tbl .hm{display:none}
  .tbl td.nm{max-width:140px}
  h1{font-size:24px}
}
@media (min-width:861px){ .side[hidden]{display:block} .x-only{display:none} }
@media (max-width:480px){ .ghost{padding:0 10px} .find{flex-basis:120px} .mark{font-size:21px} .bar{gap:8px} }
</style>

<div id="app" lang="tr">
  <header class="bar">
    <button class="mark" id="home" aria-label="Castle">
      <svg viewBox="0 0 22 24" aria-hidden="true"><path d="M2 23V5h3.6v3h3.6V5h3.6v3h3.6V5H20v18h-6.2v-5.2a2.8 2.8 0 0 0-5.6 0V23z" fill="currentColor"/></svg>
      Castle
    </button>
    <span class="mark-sub" id="sub"></span>
    <div class="find"><input id="q" type="search" autocomplete="off"></div>
    <div class="lang" id="lang" role="group" aria-label="Dil"><button data-lang="tr" aria-pressed="true" title="Türkçe">TR</button><button data-lang="en" aria-pressed="false" title="English">EN</button></div>
    <button class="ghost" id="method"></button>
  </header>
  <main class="stage">
    <section class="list" id="list"><div class="list-in" id="main"></div></section>
    <aside class="side" id="side" hidden><div class="side-in" id="panel"></div></aside>
  </main>
  <div class="sheet" id="sheet" hidden><div class="sheet-in" id="sheetin" role="dialog" aria-modal="true"></div></div>
</div>

/* ---------- yöntem ---------- */
function renderMethod() {
  var items = [
    [L("Neden genç Buffett?", "Why young Buffett?"), L("Büyük paranın yatırımcısı yalnız büyük ve kaliteli şirketlere girebilir. Küçük parayla çalışan yatırımcının üstünlüğü başkadır: küçük, ilgi görmeyen, geçici olarak ucuz kalmış paylara girebilir. Buffett 1956-1969 arasındaki ortaklığında bunu yaptı ve yatırımlarını üçe ayırdı: değerinin altındaki paylar (\"generals\"), sonucu bir şirket olayına bağlı özel durumlar (\"workouts\") ve kontrol payları. Castle ilk ikisini tarar.",
      "An investor with a lot of money can only buy large, high-quality companies. A small investor has a different edge: small, ignored, temporarily cheap shares. Buffett did this in his 1956-1969 partnership and split his investments into three: undervalued shares (\"generals\"), special situations whose outcome hangs on a corporate event (\"workouts\") and controlling stakes. Castle screens for the first two."), [], [["Buffett Partnership mektupları (1957-1970)", "Buffett Partnership letters (1957-1970)", "https://www.berkshirehathaway.com/"]]],

      [L("Banka, sigorta, aracı kurum ve finansal kiralama şirketlerinde ölçülmez.", "Not measured for banks, insurers, brokers and leasing companies."), L("Zarar eden net-net'te NCAV eriyebilir; sayfa bunu yazar.", "In a loss-making net-net NCAV can shrink; the page says so.")], [["Graham, Akıllı Yatırımcı, 15. bölüm", "Graham, The Intelligent Investor, ch. 15", ""]]],
    [lensName("gr"), L("Graham'ın girişimci yatırımcı için önerdiği altı ölçüt. Hepsi geçilmeli.", "Graham's six tests for the enterprising investor. All six must pass."),
      [L("Cari oran (dönen varlıklar ÷ kısa vadeli yükümlülükler) en az " + num(P.grCurrent, 1) + ".", "Current ratio (current assets ÷ current liabilities) at least " + num(P.grCurrent, 1) + "."),
       L("Uzun vadeli finansal borç, net işletme sermayesinin %" + num(P.grDebtWC * 100, 0) + "'unu geçmez.", "Long-term financial debt no more than " + num(P.grDebtWC * 100, 0) + "% of net working capital."),
       L("Son " + P.grYears + " mali yılda zarar yok ve son 12 ay kârda.", "No loss in the last " + P.grYears + " fiscal years and profitable over the last 12 months."),
       L("Temettü ödüyor.", "Pays a dividend."),
       L("Son yılın kârı, enflasyondan arındırılınca, dört yıl öncekinden yüksek.", "Last year's profit, adjusted for inflation, above four years earlier."),
       L("Piyasa değeri, maddi özsermayenin (ana ortaklık özsermayesi − maddi olmayan varlıklar − şerefiye) %" + num(P.grPTB * 100, 0) + "'sinin altında.", "Market value below " + num(P.grPTB * 100, 0) + "% of tangible book (parent equity − intangibles − goodwill).")], [["Graham, Akıllı Yatırımcı, 15. bölüm", "Graham, The Intelligent Investor, ch. 15", ""]]],
    [lensName("ey"), L("Kâr verimi, F/K'nın tersidir: 100 TL'lik pay için yılda kaç TL kâr. Graham, kâr veriminin en az yüksek notlu tahvil faizinin iki katı olmasını isterdi. Türkiye'de şirketler enflasyon muhasebesi uyguladığı için kâr reeldir; bu yüzden tahvilin de reel getirisiyle karşılaştırılır. Eşik en az %" + num(P.r, 0) + ".",
      "Earnings yield is the inverse of P/E: profit per year for every 100 TL of share price. Graham wanted it to be at least twice the yield on high-grade bonds. Turkish companies use inflation accounting, so profit is real; it is therefore compared with the real bond yield. The hurdle is at least " + num(P.r, 0) + "%."),
      [L("Şu an: 10 yıllık tahvil " + pct(R.y10, 2) + ", enflasyon " + pct(R.pi, 2) + ", reel getiri " + pct(R.real) + ", eşik " + pct(R.hurdle) + ".", "Now: 10-year bond " + pct(R.y10, 2) + ", inflation " + pct(R.pi, 2) + ", real yield " + pct(R.real) + ", hurdle " + pct(R.hurdle) + "."),
       L("Tek bir iyi yıl yanıltmasın diye, son 12 ayın kârı son üç mali yılın reel ortalamasından yüksekse ortalama alınır.", "So that one good year does not mislead, the three-year real average is used when it is below the last 12 months' profit."),
       L("Enflasyon muhasebesi uygulamayan şirkette (banka, sigorta, kiralama) kârdan, özsermayeyi enflasyona karşı korumak için gereken pay düşülür.", "For companies without inflation accounting (banks, insurers, leasing) the part of profit needed to keep equity whole against inflation is deducted."),
       L("GYO ve yatırım ortaklıklarına uygulanmaz.", "Not applied to REITs and investment trusts.")], []],
    [lensName("ws"), L("Bir şirket olayı ortaklara belli bir fiyat önerdiğinde (pay alım teklifi, ortaklıktan çıkarma, birleşme, ayrılma hakkı) getiri borsanın genel gidişinden çok olayın gerçekleşmesine bağlıdır. Teklif açıksa ve ödeme tarihine göre yıllık getiri 10 yıllık tahvil faizini geçiyorsa listeye girer; onay bekleyen teklif \"eşikte\" görünür.",
      "When a corporate event offers shareholders a set price (tender offer, squeeze-out, merger, exit right), the return depends on the event happening more than on the market. If the offer is open and its annualised return to the payment date beats the 10-year bond yield, it is listed; an offer awaiting approval shows as \"near\"."),
      [L("Kayıtlar KAP bildirimlerinden ve SPK bültenlerinden elle tutulur; her birinin kaynağı şirket sayfasındadır.", "Entries are kept by hand from KAP filings and CMB bulletins; each one's sources are on the company page.")], []],
    [L("Kırmızı bayrak", "Red flag"), L("Ucuzluğu yanıltıcı kılan bir olay (denetçinin olumsuz görüşü, işletmenin sürekliliği şüphesi, kayyum, SPK yaptırımı) bilindiğinde şirket listelerden çıkarılır ve nedeni sayfasında yazar.",

  ];
  var h = '<div class="sheet-top"><h2>' + esc(L("Yöntem", "Method")) + '</h2><button class="ghost" id="shut">' + esc(L("Kapat", "Close")) + '</button></div><ol class="mlist">' +
    items.map(function (it) { return "<li><b>" + esc(it[0]) + "</b>" + esc(it[1]) + (it[2].length ? "<ul>" + it[2].map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>" : "") +

  var dn = LANG === "en" && META.en && META.en.data_notes ? META.en.data_notes : META.data_notes;
  if (dn && dn.length) h += "<h3>" + esc(L("Veri notları", "Data notes")) + '</h3><ul class="ul">' + dn.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>";
  var rs = [];
  if (R.y10_src) rs.push({ t: L("10 yıllık tahvil: ", "10-year bond: ") + R.y10_src, u: R.y10_url });
  if (R.policy_src) rs.push({ t: L("Politika faizi: ", "Policy rate: ") + R.policy_src, u: R.policy_url });

  $("#sheetin").innerHTML = h;
}

  try {

    if (!u || navigator.webdriver || !/(^|\.)kosecapital\.(com|github\.io)$/.test(location.hostname)) return;
    var r = ""; try { r = document.referrer ? new URL(document.referrer).hostname : ""; } catch (e) {}
    if (r === location.hostname) r = "";
    var q = u.replace(/\/+$/, "") + "/hit?t=" + t + "&s=castle&p=" + encodeURIComponent(p || "") + "&r=" + encodeURIComponent(r) + "&l=" + LANG;
    if (!(navigator.sendBeacon && navigator.sendBeacon(q))) fetch(q, { method: "POST", mode: "no-cors", keepalive: true }).catch(function () {});
  } catch (e) {}
}
function setHash(h) { try { var want = h ? "#" + h : ""; if (location.hash !== want) { history.replaceState(null, "", want || (location.pathname + location.search)); if (h) hit("n", h); } } catch (e) {} }
function select(c) { S.sel = c; renderPanel(); renderMain(); setHash(c ? c.toLowerCase() : ""); }
function applyStatic() {

  Array.prototype.forEach.call(document.querySelectorAll("#lang button"), function (b) { b.setAttribute("aria-pressed", b.dataset.lang === LANG); });
}
function all() { applyStatic(); renderMain(); renderPanel(); if (!$("#sheet").hidden) renderMethod(); }

document.addEventListener("click", function (ev) {
  var t = ev.target.closest("button, tr[data-c]");
  if (!t) return;
  if (t.dataset.tab) { S.tab = t.dataset.tab; S.sort = null; S.n = 60; S.q = ""; $("#q").value = ""; renderMain(); return; }
  if (t.dataset.sort != null) { var k = +t.dataset.sort; if (S.sort === k) S.dir = -S.dir; else { S.sort = k; S.dir = k < 2 ? 1 : -1; } renderMain(); return; }
  if (t.dataset.c) { select(t.dataset.c); return; }
  if (t.dataset.lang) { LANG = t.dataset.lang; try { localStorage.setItem("castle.lang", LANG); } catch (e) {} NFC = {}; all(); return; }
  if (t.id === "more") { S.n += 120; renderMain(); return; }
  if (t.id === "close") { select(null); return; }
  if (t.id === "home") { S.tab = "any"; S.q = ""; $("#q").value = ""; select(null); $("#list").scrollTop = 0; return; }
  if (t.id === "method" || t.id === "method2") { renderMethod(); $("#sheet").hidden = false; hit("m", "method"); return; }
  if (t.id === "shut") { $("#sheet").hidden = true; return; }
});
document.addEventListener("change", function (ev) { if (ev.target.id === "small") { S.small = ev.target.checked; renderMain(); } });
$("#sheet").addEventListener("click", function (ev) { if (ev.target.id === "sheet") $("#sheet").hidden = true; });
document.addEventListener("keydown", function (ev) { if (ev.key === "Escape") { if (!$("#sheet").hidden) $("#sheet").hidden = true; else if (S.sel) select(null); } });
$("#q").addEventListener("input", function () { S.q = this.value; S.n = 60; renderMain(); });
$("#q").addEventListener("keydown", function (ev) { if (ev.key === "Enter") { var c = this.value.trim().toUpperCase(); if (BY[c]) select(c); else { var xs = rowsFor(S.tab); if (xs.length) select(xs[0].c); } } });
window.addEventListener("resize", function () { if (!S.sel) $("#side").hidden = window.innerWidth <= 860; });

var h0 = (location.hash || "").replace(/^#/, "").toUpperCase();
if (BY[h0]) S.sel = h0;
all();
hit("v", h0 ? h0.toLowerCase() : "");
})();
