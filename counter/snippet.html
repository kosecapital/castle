<!-- Kose Capital ziyaret sayacı: ana sayfanın </body> etiketinden hemen önce yapıştırılır.
     SAYAC_ADRESI yerine Worker adresi yazılır (örnek: https://kose-sayac.<hesap>.workers.dev). Çerez yok, kişisel veri gönderilmez. -->
<script>
(function () {
  try {
    var u = "SAYAC_ADRESI";
    if (navigator.webdriver || !/(^|\.)kosecapital\.(com|github\.io)$/.test(location.hostname)) return;
    var r = "";
    try { r = document.referrer ? new URL(document.referrer).hostname : ""; } catch (e) {}
    if (r === location.hostname) r = "";
    var q = u.replace(/\/+$/, "") + "/hit?t=v&s=home&p=" + encodeURIComponent(location.pathname.replace(/^\/+|\/+$/g, "")) + "&r=" + encodeURIComponent(r) + "&l=" + (document.documentElement.lang || "").slice(0, 2);
    if (!(navigator.sendBeacon && navigator.sendBeacon(q))) fetch(q, { method: "POST", mode: "no-cors", keepalive: true }).catch(function () {});
  } catch (e) {}
})();
</script>
