# Veri kaynağını yoklar: TradingView tarayıcısı GitHub'ın makinelerinden yanıt veriyor mu, hangi alanlar dolu?
name: probe
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/probe.yml"
      - "pipeline/probe.request"
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Yokla
        run: |
          mkdir -p data/_probe
          for m in turkey america; do
            python3 pipeline/collect.py probe "$m" > "data/_probe/$m.txt" 2>&1 || echo "BASARISIZ: cikis kodu $?" >> "data/_probe/$m.txt"
          done
          python3 pipeline/collect.py dump turkey FROTO,ISMEN,BIMAS,AKBNK > data/_probe/turkey_dump.json 2>&1 || true
          python3 pipeline/collect.py dump america AAPL,KO > data/_probe/america_dump.json 2>&1 || true
          date -u +"%Y-%m-%dT%H:%M:%SZ" > data/_probe/when.txt
      - name: Sonucu depoya yaz
        run: |
          git config user.name "castle-bot"
          git config user.email "castle-bot@users.noreply.github.com"
          git add data/_probe
          git commit -m "Yoklama çıktısı" || echo "değişiklik yok"
          git push
